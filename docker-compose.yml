services:
  postgres:
    image: postgres:17-alpine
    container_name: forge-db
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge2026
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - forge-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  forge-db-data:
